name: pocket-35b
backend: llama-cpp
known_usecases: [chat]
context_size: 8192
gpu_layers: 99
f16: true
flash_attention: true
mmap: true
cache_type_k: q8_0
cache_type_v: q8_0
parameters:
  model: POCKET-35B-IQ1_M.gguf
  temperature: 0.6
  top_p: 0.95
  top_k: 20
download_files:
  - filename: POCKET-35B-IQ1_M.gguf
    uri: https://huggingface.co/FINAL-Bench/POCKET-35B-GGUF/resolve/main/POCKET-35B-IQ1_M.gguf
options:
  - use_jinja:true
function:
  automatic_tool_parsing_fallback: true
  grammar:
    disable: true
template:
  use_tokenizer_template: true
stopwords:
  - "<|im_end|>"
  - "<|endoftext|>"
