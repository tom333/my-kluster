# Tuning sysctl pour MicroK8s mononoeud (~50 pods, workloads ML/Postgres/Qdrant).
# Installation : sudo install -m 0644 99-k8s-microk8s.conf /etc/sysctl.d/
#                sudo sysctl --system
# Vérification :  sysctl fs.inotify.max_user_watches vm.max_map_count net.netfilter.nf_conntrack_max
#
# Note : valeurs idempotentes — si un autre fichier /etc/sysctl.d/ ou un défaut
# Ubuntu fournit déjà une valeur >= cible, ce fichier ne dégrade rien (l'ordre
# 99- garantit qu'on s'applique en dernier).

# --- File watchers (Argo, kubelet, jupyter, code-server) ---
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches   = 524288

# --- mmap (Qdrant, Postgres, MLflow artifact store, Elasticsearch-like) ---
vm.max_map_count = 524288

# --- Connection tracking (NGINX ingress + nombreux pods sortants) ---
# Défaut Ubuntu ~196k, on monte pour absorber les pics ArgoCD sync + scrapes.
net.netfilter.nf_conntrack_max = 524288
net.netfilter.nf_conntrack_tcp_timeout_established = 86400

# --- TCP / sockets ---
net.core.somaxconn          = 4096
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.ip_local_port_range = 1024 65535

# --- Pré-requis K8s standard (normalement déjà à 1 sur Ubuntu) ---
net.ipv4.ip_forward                 = 1
net.bridge.bridge-nf-call-iptables  = 1
net.bridge.bridge-nf-call-ip6tables = 1
