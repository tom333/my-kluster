{{- if .Values.modelsConfigs }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "localai.fullname" . }}-models-config
  labels:
    {{- include "localai.labels" . | nindent 4 }}
data:
  {{- range $name, $config := .Values.modelsConfigs }}
  {{- /* Une valeur null neutralise un modèle hérité des values de base
         (pattern multi-instance : l'app jeux nullifie les gros modèles pc).
         Selon la version Helm/ArgoCD, la clé null peut fuiter dans le range
         au lieu d'être supprimée → on l'ignore explicitement. */}}
  {{- if $config }}
  {{ $name }}.yaml: |-
{{ $config | indent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
