{{- if .Values.modelsConfigs }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "localai.fullname" . }}-models-config
  labels:
    {{- include "localai.labels" . | nindent 4 }}
data:
  {{- /* modelsConfigsInclude (liste, optionnelle) = ALLOWLIST pour les
         instances secondaires (ex. localai-jeux) : seules les clés listées
         sont rendues. Nécessaire car le pattern `clé: null` ne survit PAS au
         valuesObject d'ArgoCD (les nulls sont strippés à la sérialisation →
         l'overlay n'écrase rien et l'instance hérite des gros modèles).
         Les listes Helm REMPLACENT (pas de merge) → robuste, et un nouveau
         modèle ajouté aux values de base ne fuite jamais sur l'instance.
         Absente/vide → tout est rendu (instance principale). */}}
  {{- $include := .Values.modelsConfigsInclude | default list }}
  {{- range $name, $config := .Values.modelsConfigs }}
  {{- if and $config (or (empty $include) (has $name $include)) }}
  {{ $name }}.yaml: |-
{{ $config | indent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
