id: bonsai-watch
namespace: veille
description: >
  Alerte quand Ternary-Bonsai-27B (Q2_0 ternaire) devient déployable sur LocalAI (runtime installable). Ex-cron Hermes « bonsai-backend-watch » (no_agent).
labels:
  remplace: hermes-cron-7ebbddc10caa

tasks:
  - id: watcher
    type: io.kestra.plugin.core.flow.Subflow
    namespace: veille
    flowId: watcher
    wait: true
    transmitFailed: true
    inputs:
      script: scripts/bonsai-watcher/bonsai_watch.py
      cle_etat: bonsai_watch_state
      var_etat: BONSAI_WATCH_STATE

triggers:
  - id: planifie
    type: io.kestra.plugin.core.trigger.Schedule
    # Watcher Python pur : n'appelle pas le LLM, donc aligné sur les créneaux sans les encombrer.
    cron: "0 7,20 * * *"
    timezone: Pacific/Noumea
    # NONE : changer l'heure ne doit pas rejouer les créneaux manqués (défaut ALL).
    recoverMissedSchedules: NONE
