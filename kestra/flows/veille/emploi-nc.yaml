id: emploi-nc
namespace: veille
description: >
  Offres d'emploi tech / data / IA en Nouvelle-Calédonie (ex-cron Hermes
  « job-scraper-data-ia »). Pas de flux RSS : les pages sont lues en HTML, une
  extraction JSON par page par le LLM, dédup par empreinte (KV), puis un message.
labels:
  remplace: hermes-cron-a38355a79f36

variables:
  localai: http://localai.localai.svc.cluster.local:8080/v1/chat/completions
  modele: gemma-4-12b-it-qat
  chat_id: "843341688"
  pages:
    # lemploi.nc : appli Inertia.js, la page d'accueil n'a pas de texte (« page vide »).
    # La liste paginée est lue en JSON, cf. lignes_lemploi() plus bas.
    - https://www.lemploi.nc/offres-d-emploi
    - https://emploi.nc
    - https://job.nc/
    - https://www.aircalin.fr/fr/recrutement
    - https://groupejeandot.nc/offres-emploi
    - https://drhfpnc.gouv.nc/avis-vacances-postes-AVP
    - https://www.gbnc.nc/nos-opportunites
    - https://www.cph.nc/le-groupe/carrieres/offres-demploi/
    # SPC / CPS : appli React (coquille de 825 octets), lue via son API TR1, cf. lignes_spc().
    - https://fr.careers.spc.int/
    - https://www.saintvincent.nc/recrutement
    - https://ballandesas.nc/nous-rejoindre/
    - https://carrieres.bci.nc/
    - https://www.bnc.nc/informations/recrutement?view=listing
    - https://societegenerale.nc/fr/votre-banque/recrutement/opportunites-demploi/

tasks:
  - id: vues
    type: io.kestra.plugin.core.kv.Get
    key: emploi_nc_vues
    errorOnMissing: false

  # Lecture des pages (stdlib), extraction par le LLM PAGE PAR PAGE en JSON strict
  # (une page = un appel court, plus fiable qu'un seul appel sur 14 pages), filtre
  # tech/data, dédup par empreinte titre+entreprise, message final.
  - id: collecte
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    inputFiles:
      vues.json: "{{ outputs.vues.value ?? '[]' }}"
      pages.json: "{{ vars.pages | toJson }}"
    env:
      LOCALAI: "{{ vars.localai }}"
      MODELE: "{{ vars.modele }}"
      LOCALAI_API_KEY: "{{ secret('LOCALAI_API_KEY') }}"
      TELEGRAM_TOKEN: "{{ secret('TELEGRAM_TOKEN') }}"
      CHAT_ID: "{{ vars.chat_id }}"
    script: |
      import hashlib, json, os, re, sys, urllib.request
      from html import unescape

      UA = "Mozilla/5.0 (X11; Linux x86_64; rv:130.0) Gecko/20100101 Firefox/130.0"
      vues = set(json.load(open("vues.json")))
      pages = json.load(open("pages.json"))
      if isinstance(pages, str):
          pages = json.loads(pages)

      def texte_page(url):
          req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept-Language": "fr"})
          with urllib.request.urlopen(req, timeout=40) as r:
              html = r.read(600_000).decode("utf-8", "replace")
          html = re.sub(r"(?is)<(script|style|noscript|svg)[^>]*>.*?</\1>", " ", html)
          # garder les liens : « texte (href) » pour que le LLM rende de vrais href
          html = re.sub(r'(?is)<a\s[^>]*href="([^"]+)"[^>]*>(.*?)</a>', lambda m: " %s (%s) " % (re.sub(r"<[^>]+>", " ", m.group(2)), m.group(1)), html)
          t = " ".join(unescape(re.sub(r"<[^>]+>", " ", html)).split())
          return t[:9000]

      def lignes_lemploi(base):
          # Appli Inertia.js : chaque page HTML porte sa liste d'offres en JSON dans
          # l'attribut `data-page` (pas besoin de la poignée de main X-Inertia-Version).
          # 12 offres par page, `?page=N`, lien de détail = /offres-d-emploi/{slug}.
          lignes, page, derniere = [], 1, 1
          while page <= min(derniere, 20):
              req = urllib.request.Request("%s?page=%d" % (base, page), headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=40) as r:
                  h = r.read().decode("utf-8", "replace")
              m = re.search(r'data-page="([^"]+)"', h)
              if not m:
                  break
              j = json.loads(unescape(m.group(1)))["props"]["jobOffers"]
              derniere = j.get("last_page") or 1
              for o in j.get("data", []):
                  lignes.append("%s | %s | %s | %s | %s (https://www.lemploi.nc/offres-d-emploi/%s)" % (
                      o.get("title"), o.get("company"), o.get("city"),
                      o.get("jobFunctions"), o.get("areaActivities"), o.get("slug")))
              page += 1
          return lignes

      # Le site carrières de la CPS est une marque blanche TR1 : le navigateur charge les
      # offres depuis cette API (URL relevée dans l'onglet Réseau, 2026-10-28).
      SPC_API = ("https://api.tr1.com.au/backend/public/api/getjoblist/369010d0-d94b-4783-8f0f-ff7f92563f59"
                 "?domainWithHttp=https://fr.careers.spc.int&sort=newest&perPage=50&page=%d")

      def lignes_spc(base):
          lignes, page = [], 1
          while page <= 10:
              req = urllib.request.Request(SPC_API % page, headers={"User-Agent": UA, "Accept": "application/json"})
              with urllib.request.urlopen(req, timeout=40) as r:
                  j = json.load(r)["data"]["jobs"]
              items = j.get("items") or []
              for o in items:
                  lignes.append("%s | Communauté du Pacifique (CPS) | %s | %s (https://fr.careers.spc.int/view/%s)" % (
                      o.get("title"), (o.get("location") or {}).get("location"),
                      " ".join((o.get("description") or "").split())[:200], o.get("id")))
              if not items or len(lignes) >= (j.get("totalRecord") or 0):
                  break
              page += 1
          return lignes

      # Sources lues en JSON : une liste vide y est légitime (aucune offre), pas une erreur.
      SOURCES_JSON = {"lemploi.nc/offres-d-emploi": lignes_lemploi, "careers.spc.int": lignes_spc}

      def llm(page, texte):
          consigne = (
              "Tu extrais des OFFRES D'EMPLOI depuis le texte d'une page web (les liens y figurent entre "
              "parenthèses après leur libellé). Ne garde QUE les offres tech / data / IT : data (analyst, "
              "scientist, engineer), machine learning / IA, développement, Python, SQL, DevOps, réseau, "
              "cybersécurité. Jette tout le reste (mécanique, vente, secrétariat, santé, finance non-IT…). "
              "Réponds UNIQUEMENT par un tableau JSON, sans texte autour : "
              '[{"titre": "...", "entreprise": "...", "lieu": "...", "lien": "..."}]. '
              "Le lien est l'URL entre parenthèses la plus proche du titre ; si elle est relative, "
              "préfixe-la par l'origine de la page ; s'il n'y en a pas, mets l'URL de la page. "
              "Aucune offre : []."
          )
          corps = json.dumps({"model": os.environ["MODELE"], "temperature": 0.2, "max_tokens": 1500, "reasoning_effort": "none",
                              "messages": [{"role": "system", "content": consigne},
                                           {"role": "user", "content": "PAGE: %s\n\n%s" % (page, texte)}]}).encode()
          req = urllib.request.Request(os.environ["LOCALAI"], data=corps, headers={"Content-Type": "application/json", "Authorization": "Bearer " + os.environ["LOCALAI_API_KEY"]})
          with urllib.request.urlopen(req, timeout=600) as r:
              contenu = json.load(r)["choices"][0]["message"].get("content") or "[]"
          m = re.search(r"\[.*\]", contenu, re.S)
          try:
              return json.loads(m.group(0)) if m else []
          except json.JSONDecodeError:
              return []

      offres, erreurs, nouvelles = [], [], []
      for page in pages:
          lecteur = next((f for motif, f in SOURCES_JSON.items() if motif in page), None)
          try:
              if lecteur:
                  ls = lecteur(page)
                  # ~100 offres possibles : paquets de 40 lignes (~8 000 car.) pour rester court par appel
                  morceaux = ["\n".join(ls[i:i + 40]) for i in range(0, len(ls), 40)]
              else:
                  morceaux = [texte_page(page)]
          except Exception as e:
              erreurs.append("%s : %s" % (page, str(e)[:60])); continue
          if not lecteur and len(morceaux[0]) < 200:
              erreurs.append("%s : page vide (%d car.)" % (page, len(morceaux[0]))); continue
          for o in (x for t in morceaux for x in llm(page, t)):
              if not isinstance(o, dict) or not o.get("titre"):
                  continue
              cle = hashlib.sha1(("%s|%s" % (o.get("titre", ""), o.get("entreprise", ""))).lower().encode()).hexdigest()[:16]
              offres.append(cle)
              if cle not in vues:
                  nouvelles.append(o)

      lignes = ["• %s — %s (%s) — %s" % (o.get("titre", "?"), o.get("entreprise", "?"), o.get("lieu", "NC"), o.get("lien", "")) for o in nouvelles]
      texte = "💼 Offres tech/data NC — %d nouvelle(s)\n\n" % len(nouvelles) + "\n".join(lignes) if nouvelles else ""
      if erreurs:
          texte += ("\n\n" if texte else "⚠️ Emploi NC — aucune nouvelle offre, mais des sources en erreur :\n") + "\n".join("⚠️ " + e for e in erreurs)

      if texte:
          url = "https://api.telegram.org/bot%s/sendMessage" % os.environ["TELEGRAM_TOKEN"]
          for i in range(0, len(texte), 3900):
              corps = json.dumps({"chat_id": os.environ["CHAT_ID"], "text": texte[i:i + 3900], "disable_web_page_preview": True}).encode()
              with urllib.request.urlopen(urllib.request.Request(url, data=corps, headers={"Content-Type": "application/json"}), timeout=30) as r:
                  if not json.load(r).get("ok"):
                      raise SystemExit("Telegram a refusé l'envoi")

      # mémoire bornée : les 2 000 dernières empreintes vues
      vues_maj = (list(vues) + [c for c in offres if c not in vues])[-2000:]
      print("::" + json.dumps({"outputs": {"nouvelles": len(nouvelles), "total": len(offres), "erreurs": len(erreurs), "vues_maj": json.dumps(vues_maj)}}) + "::")

  - id: memoriser
    type: io.kestra.plugin.core.kv.Set
    key: emploi_nc_vues
    value: "{{ outputs.collecte.vars.vues_maj }}"

triggers:
  - id: quotidien
    type: io.kestra.plugin.core.trigger.Schedule
    # 7h30 et non 7h00 : ce flux fait ses PROPRES appels LLM (14 pages), hors du subflow
    # `digest`. La limite de concurrence de `digest` ne le couvre donc pas — le décalage
    # évite qu'il charge gemma pendant qu'un digest l'utilise déjà.
    cron: "30 7 * * *"
    timezone: Pacific/Noumea
    # NONE : changer l'heure ne doit pas rejouer les créneaux manqués (défaut ALL).
    recoverMissedSchedules: NONE
