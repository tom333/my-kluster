id: korben
namespace: veille
description: >
  Résumé quotidien des articles de Korben.info (ex-cron Hermes « Résumé Korben soir »). Collecte et dédup par Miniflux, catégorie « korben ».

labels:
  remplace: hermes-cron-e8c4b8c91103

tasks:
  - id: digest
    type: io.kestra.plugin.core.flow.Subflow
    namespace: veille
    flowId: digest
    wait: true
    transmitFailed: true
    inputs:
      categorie: korben
      max_entrees: 12
      consigne: |
        Pour CHAQUE article fourni, dans l'ordre : une ligne de titre commençant par un emoji
        thématique, un résumé de 2 à 3 phrases, puis la ligne '🔗 ' + lien exact. Tous les
        articles sont à rapporter : ne trie pas, ne filtre pas.

triggers:
  - id: planifie
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 9 * * *"
