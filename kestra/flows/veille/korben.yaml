id: korben
namespace: veille
description: >
  Résumé quotidien des articles de Korben.info sur Telegram. Transposition du cron
  Hermes « Résumé Korben soir » (job e8c4b8c91103). La collecte et la dédup sont
  faites par Miniflux (catégorie « korben ») : ce flux ne lit que les NON-LUS,
  résume en un appel LLM, envoie, puis marque lu.

labels:
  source: korben.info
  remplace: hermes-cron-e8c4b8c91103

variables:
  miniflux: http://miniflux.miniflux.svc.cluster.local:8080
  categorie: korben
  # gemma via LocalAI, en cluster : résumer 5 à 15 items titrés, l'usage où un
  # 12 B est bon. `reasoning_effort: none` — sinon il dépense tout le budget en
  # raisonnement et rend un contenu vide (mesuré le 2026-09-16).
  localai: http://localai.localai.svc.cluster.local:8080/v1/chat/completions
  modele: gemma-4-12b-it-qat
  chat_id: "843341688"

tasks:
  # 1. Les catégories : l'id de « korben » se résout par son titre, pour que le
  #    flux reste valable si Miniflux est recréé.
  - id: categories
    type: io.kestra.plugin.core.http.Request
    uri: "{{ vars.miniflux }}/v1/categories"
    headers:
      X-Auth-Token: "{{ secret('MINIFLUX_TOKEN') }}"

  # 2. Les entrées NON LUES de la catégorie. C'est tout le curseur « nouveau
  #    depuis le dernier digest » : Miniflux a poll, dédupliqué par GUID et tenu
  #    l'état ; il n'y a plus ni fenêtre temporelle ni liste de liens en KV.
  - id: non_lus
    type: io.kestra.plugin.core.http.Request
    uri: "{{ vars.miniflux }}/v1/categories/{{ outputs.categories.body | jq('.[] | select(.title == \"' ~ vars.categorie ~ '\") | .id') | first }}/entries?status=unread&order=published_at&direction=asc&limit=40"
    headers:
      X-Auth-Token: "{{ secret('MINIFLUX_TOKEN') }}"

  # 3. Préparer l'appel LLM (stdlib : le venv de l'image n'a pas pip). Le corps
  #    est construit ici en JSON propre plutôt qu'en littéral Pebble.
  - id: prepare
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    # Les entrées (contenu HTML complet) passent en FICHIER, pas en variable
    # d'environnement : 34 articles dépassaient la taille d'un exec
    # (« Argument list too long », mesuré le 2026-09-16).
    inputFiles:
      entrees.json: "{{ outputs.non_lus.body | toJson }}"
    env:
      MODELE: "{{ vars.modele }}"
    script: |
      import json, os, re
      from html import unescape

      def sans_html(s):
          return " ".join(unescape(re.sub(r"<[^>]+>", " ", s or "")).replace("\xa0", " ").split())

      with open("entrees.json", encoding="utf-8") as f:
          donnees = json.load(f)
      # `body | toJson` rend une CHAINE JSON (le corps est déjà du texte) : on
      # décode une seconde fois si nécessaire.
      if isinstance(donnees, str):
          donnees = json.loads(donnees)
      # Plafond par run : au-dela, Telegram (4 096 car.) et la qualite du digest
      # cedent. Les entrees restantes restent NON LUES et partent au run suivant.
      entrees = donnees.get("entries", [])[:12]
      items = [{"titre": e.get("title", "").strip(), "lien": e.get("url"), "resume": sans_html(e.get("content"))[:600]} for e in entrees]
      ids = [e["id"] for e in entrees]

      consigne = (
          "Tu rédiges un digest Telegram en français des nouveaux articles de Korben.info. "
          "Pour CHAQUE article fourni, dans l'ordre : une ligne de titre commençant par un emoji "
          "thématique, puis un résumé de 2 à 3 phrases, puis une ligne '🔗 ' suivie du lien EXACT "
          "fourni. Sépare les articles par une ligne '———'. Texte brut uniquement : pas de Markdown, "
          "pas d'astérisques, pas de crochets. N'invente aucun lien, n'ajoute aucun article, aucune "
          "introduction ni conclusion. Longueur totale sous 3000 caractères (Telegram coupe à 4096) : "
          "si nécessaire, raccourcis les résumés, jamais les liens."
      )
      corps = {
          "model": os.environ["MODELE"],
          "temperature": 1.0,
          "max_tokens": 2048,
          "reasoning_effort": "none",
          "messages": [
              {"role": "system", "content": consigne},
              {"role": "user", "content": json.dumps(items, ensure_ascii=False)},
          ],
      }
      print("::" + json.dumps({"outputs": {
          "n": len(items),
          "ids": json.dumps(ids),
          "titres": [i["titre"] for i in items],
          "corps": json.dumps(corps, ensure_ascii=False),
      }}, ensure_ascii=False) + "::")

  # 4. Rien de non-lu : silence.
  - id: si_nouveaux
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.prepare.vars.n > 0 }}"
    then:
      # 5. UN appel LLM. Délais explicites (Kestra 2.0.2 : connectTimeout et
      #    readIdleTimeout seulement ; le défaut de lecture est de 10 s).
      - id: resume
        type: io.kestra.plugin.core.http.Request
        uri: "{{ vars.localai }}"
        method: POST
        contentType: application/json
        headers:
          Authorization: "Bearer {{ secret('LOCALAI_API_KEY') }}"
        options:
          timeout:
            connectTimeout: PT30S
            readIdleTimeout: PT10M
        body: "{{ outputs.prepare.vars.corps }}"

      # 6. Découpe (4 096 car. max par message Telegram, jamais au milieu d'un
      #    article) et envoi, un message par morceau. En Python stdlib : le type
      #    ForEach n'est pas reconnu par cette version, et l'appel sendMessage
      #    tient en dix lignes. Jeton du bot Hermes : sendMessage seul, pas de
      #    polling, aucun conflit avec la passerelle.
      - id: envoi
        type: io.kestra.plugin.scripts.python.Script
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        inputFiles:
          reponse.json: "{{ outputs.resume.body | toJson }}"
        env:
          TELEGRAM_TOKEN: "{{ secret('TELEGRAM_TOKEN') }}"
          CHAT_ID: "{{ vars.chat_id }}"
        script: |
          import json, os, time, urllib.request
          with open("reponse.json", encoding="utf-8") as f:
              d = json.load(f)
          if isinstance(d, str):
              d = json.loads(d)
          texte = (d["choices"][0]["message"].get("content") or "").strip()
          if not texte:
              raise SystemExit("le modèle a rendu un contenu vide")
          morceaux, courant = [], ""
          for b in (x.strip() for x in texte.split("———") if x.strip()):
              candidat = (courant + "\n———\n" + b) if courant else b
              if len(candidat) > 3800 and courant:
                  morceaux.append(courant); courant = b
              else:
                  courant = candidat
          if courant:
              morceaux.append(courant)
          url = "https://api.telegram.org/bot%s/sendMessage" % os.environ["TELEGRAM_TOKEN"]
          for i, m in enumerate(morceaux):
              corps = json.dumps({"chat_id": os.environ["CHAT_ID"], "text": m[:4096], "disable_web_page_preview": True}).encode()
              req = urllib.request.Request(url, data=corps, headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  rep = json.load(r)
              if not rep.get("ok"):
                  raise SystemExit("Telegram: %s" % rep)
              if i + 1 < len(morceaux):
                  time.sleep(1)
          print("::" + json.dumps({"outputs": {"messages": len(morceaux), "caracteres": len(texte)}}) + "::")

      # 7. Marquer lu APRÈS l'envoi : un envoi raté laisse les entrées non lues,
      #    elles repartent au run suivant.
      - id: marquer_lu
        type: io.kestra.plugin.core.http.Request
        uri: "{{ vars.miniflux }}/v1/entries"
        method: PUT
        contentType: application/json
        headers:
          X-Auth-Token: "{{ secret('MINIFLUX_TOKEN') }}"
        body: '{"entry_ids": {{ outputs.prepare.vars.ids }}, "status": "read"}'

triggers:
  # Même heure que le cron Hermes (09:30 UTC = 20:30 en Nouvelle-Calédonie).
  - id: quotidien
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 9 * * *"
