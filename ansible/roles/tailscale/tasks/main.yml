---
# `tailscale_enabled` permet d'exclure un hôte sans le retirer des groupes k8s.
# Mis à false sur gaming-pc : c'est un poste de salle de jeux qui n'a aucun
# besoin d'accès distant hors LAN, et le rôle échouait de toute façon en
# simulation (le service n'existe pas tant que l'installateur n'a pas tourné).
- ansible.builtin.import_tasks: install.yml
  when: tailscale_enabled | bool
