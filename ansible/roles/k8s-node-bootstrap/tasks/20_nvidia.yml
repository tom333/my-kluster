---
- name: Check for NVIDIA GPU presence
  ansible.builtin.command: lspci
  register: lspci_out
  changed_when: false
  check_mode: false

- name: Skip NVIDIA section if no GPU detected
  ansible.builtin.meta: end_play
  when: lspci_out.stdout is not search('NVIDIA')

- name: Check NVIDIA driver running (nvidia-smi)
  ansible.builtin.command: nvidia-smi
  register: nvidia_smi
  changed_when: false
  check_mode: false
  failed_when: false

- name: Check NVIDIA driver package installed (si smi KO = chargement pending reboot)
  ansible.builtin.shell: "dpkg -l 'nvidia-driver-*' 2>/dev/null | grep -q '^ii'"
  register: nvidia_pkg
  changed_when: false
  check_mode: false
  failed_when: false
  when: nvidia_smi.rc != 0

- name: Ensure NVIDIA driver present (actif OU installé/reboot-pending)
  ansible.builtin.assert:
    that:
      - nvidia_smi.rc == 0 or (nvidia_pkg.rc | default(1)) == 0
    fail_msg: "Driver NVIDIA ni actif ni installé — le rôle desktop doit l'installer d'abord."
    success_msg: "{{ 'Driver NVIDIA actif' if nvidia_smi.rc == 0 else 'Driver NVIDIA installé (se chargera au prochain reboot)' }}"

- name: Add NVIDIA Container Toolkit GPG key
  ansible.builtin.shell:
    cmd: |
      curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey \
        | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg

- name: Add NVIDIA Container Toolkit APT repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://nvidia.github.io/libnvidia-container/stable/deb/{{ ansible_architecture | replace('x86_64', 'amd64') }} /"
    state: present
    filename: nvidia-container-toolkit
    update_cache: true

- name: Install nvidia-container-toolkit
  ansible.builtin.apt:
    name: nvidia-container-toolkit
    state: present

- name: Enable nvidia-persistenced (reduce CUDA wake-up latency)
  ansible.builtin.systemd:
    name: nvidia-persistenced
    enabled: true
    state: started
  register: persistenced
  failed_when:
    - persistenced is failed
    # Ne fail que si le driver EST actif (échec réel). Si driver installé mais pas
    # encore chargé (pré-reboot), le service démarrera au boot -> on tolère.
    - nvidia_smi.rc == 0

# Ubuntu 26.04+ dropped the dpkg diversion that provided /sbin/ldconfig.real.
# The gpu-operator toolkit regenerates a config.toml pinned to "@/sbin/ldconfig.real",
# so its prestart hook fails with "ldcache error: /sbin/ldconfig.real: no such file".
# A symlink satisfies the path and survives daemonset config regeneration.
- name: Restore /sbin/ldconfig.real symlink (gpu-operator prestart hook, Ubuntu 26.04+)
  ansible.builtin.file:
    src: /sbin/ldconfig
    dest: /sbin/ldconfig.real
    state: link
    force: false
