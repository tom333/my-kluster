---
# k8s-cache-watchdog — relève périodiquement l'écart de révision entre lecture à
# quorum et lecture servie par le cache, et redémarre kubelite si les caches ont
# décroché. Palliatif : cf.
# docs/superpowers/specs/2026-08-27-dqlite-panne-plan-de-controle.md

- name: Préflight — vault_telegram_bot_token doit être défini
  ansible.builtin.assert:
    that:
      - vault_telegram_bot_token is defined
      - vault_telegram_bot_token | length > 0
    fail_msg: "vault_telegram_bot_token doit être défini dans vault.yml"

- name: Préflight — python3 requis pour lire la révision des réponses API
  ansible.builtin.command: python3 -c "import json"
  changed_when: false
  check_mode: false

- name: Préflight — le kubeconfig doit exister
  ansible.builtin.stat:
    path: "{{ k8s_cache_watchdog_kubeconfig }}"
  register: kubeconfig_stat
  check_mode: false
  # become OBLIGATOIRE : sur un worker le seul kubeconfig utilisable est celui du
  # kubelet, sous /var/snap/.../credentials/, lisible par root uniquement. Sans
  # become, le stat le declare absent et le role echoue sur un nœud parfaitement sain.
  become: true

- name: Préflight — kubeconfig introuvable
  ansible.builtin.assert:
    that:
      - kubeconfig_stat.stat.exists
    fail_msg: |
      {{ k8s_cache_watchdog_kubeconfig }} est introuvable.
      Sur un CONTROL-PLANE : lancer d'abord k8s-node-bootstrap.
      Sur un WORKER : il n'y a pas de kubeconfig utilisateur, et `microk8s kubectl`
      y refuse de tourner. Utiliser celui du kubelet, deja present :
        k8s_cache_watchdog_kubeconfig: /var/snap/microk8s/current/credentials/kubelet.config
      Ses droits ne couvrent PAS une lecture cluster-wide : le controle d'ecart de
      cache s'y neutralise tout seul, seul le controle local des pods s'applique —
      ce qui est precisement ce qui compte sur un worker.

- name: Répertoire d'état
  ansible.builtin.file:
    path: "{{ k8s_cache_watchdog_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  become: true

- name: Installer le script de relevé
  ansible.builtin.template:
    src: k8s-cache-watchdog.sh.j2
    dest: "{{ k8s_cache_watchdog_script_path }}"
    owner: root
    group: root
    mode: "0750"
  become: true

- name: Installer les unités systemd
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  loop:
    - "{{ k8s_cache_watchdog_service_name }}.service"
    - "{{ k8s_cache_watchdog_service_name }}.timer"
    - "{{ k8s_cache_watchdog_service_name }}-notify.service"
  notify: reload systemd

- name: Activer le timer
  ansible.builtin.systemd:
    name: "{{ k8s_cache_watchdog_service_name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  become: true
