---
# Openbox session (user autostart + tint2 launchers) + CPU governor.

- name: Ensure user config dirs
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - .config/openbox
    - .config/tint2

- name: Openbox autostart (tint2 + bg + no blank)
  ansible.builtin.template:
    src: openbox-autostart.j2
    dest: "/home/{{ ansible_user }}/.config/openbox/autostart"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: tint2 panel + launchers
  ansible.builtin.template:
    src: tint2rc.j2
    dest: "/home/{{ ansible_user }}/.config/tint2/tint2rc"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  when: desktop_frontend == 'tint2'

# i3lock plutôt que light-locker. light-locker verrouille en BASCULANT vers le
# greeter LightDM sur un autre terminal virtuel : le 2026-08-21 le greeter a
# accepté le mot de passe sans jamais rendre la main à la session, et il a fallu
# tuer le verrou par SSH PUIS taper Ctrl+Alt+F7 au clavier physique.
# i3lock verrouille DANS la session courante : ni VT ni greeter, et la
# récupération tient en `pkill i3lock` depuis n'importe quelle machine.
# xss-lock relie l'économiseur X au verrou (déclenchement à l'inactivité).
- name: Install screen locker (i3lock + xss-lock)
  ansible.builtin.apt:
    name:
      - i3lock
      - xss-lock
    state: present
    update_cache: false
  when: desktop_screenlock | bool

- name: Remove light-locker (remplacé par i3lock)
  ansible.builtin.apt:
    name: light-locker
    state: absent
    purge: true

- name: CPU tuning service (governor + EPP au boot)
  ansible.builtin.template:
    src: cpu-governor.service.j2
    dest: /etc/systemd/system/cpu-governor.service
    owner: root
    group: root
    mode: '0644'
  when: desktop_force_cpu_governor | bool or (desktop_cpu_epp | length > 0)
  notify: reload systemd (desktop)

- name: Enable + start CPU tuning service
  ansible.builtin.systemd:
    name: cpu-governor.service
    enabled: true
    state: started
    daemon_reload: true
  when:
    - desktop_force_cpu_governor | bool or (desktop_cpu_epp | length > 0)
    - not ansible_check_mode

- name: Remove CPU tuning service if disabled (AMD amd_pstate active gère seul)
  ansible.builtin.systemd:
    name: cpu-governor.service
    enabled: false
    state: stopped
    masked: false
  failed_when: false
  when:
    - not (desktop_force_cpu_governor | bool)
    - desktop_cpu_epp | length == 0
    - not ansible_check_mode


# Verrouillage à distance via l'économiseur X (`xset s activate`), que xss-lock
# écoute pour lancer i3lock : un seul mécanisme pour le déclenchement manuel et
# pour l'inactivité. Déverrouillage de secours : `ssh <hote> pkill i3lock`.
# L'environnement graphique est relu sur `openbox`, car une session SSH n'a ni
# DISPLAY ni XAUTHORITY. Le script le
# reprend sur `openbox`, seul processus certainement issu de la vraie session
# (ne pas viser pegasus-fe : il peut avoir été relancé hors session, son
# environnement est alors celui du shell qui l'a lancé).
# Posé dans /usr/local/bin et pas ~/bin : ce dernier n'est PAS dans le PATH
# d'une commande SSH non interactive (~/.profile n'est pas lu dans ce mode).
# Usage : ssh moi@<hote> verrouiller
- name: Verrou — script de verrouillage distant
  ansible.builtin.copy:
    dest: /usr/local/bin/verrouiller
    owner: root
    group: root
    mode: '0755'
    content: |
      #!/usr/bin/env bash
      set -eu
      P=$(pgrep -x openbox | head -1) || { echo "session graphique introuvable" >&2; exit 1; }
      while IFS= read -r -d "" v; do
        case "$v" in XDG_*|DBUS_*|DISPLAY=*|XAUTHORITY=*) export "$v";; esac
      done < "/proc/$P/environ"
      exec xset s activate
  when: desktop_screenlock | bool

# Message plein écran temporaire, déclenchable à distance ("A TABLE !").
# Fenêtre GTK de type POPUP = override-redirect : dessinée au-dessus de tout,
# jeu plein écran compris, sans passer par le gestionnaire de fenêtres. Bandeau
# opaque et non plein écran car Openbox n'a pas de compositeur (pas de RGBA).
# Le script récupère seul l'environnement graphique — voir la note du verrou.
# Usage : ssh moi@<hote> "annoncer 'A TABLE !' 10"
- name: Annonce — script de message à l'écran
  ansible.builtin.copy:
    src: annoncer
    dest: /usr/local/bin/annoncer
    owner: root
    group: root
    mode: '0755'

# Jellyfin Media Player (Qt/mpv) demande l'inhibition de l'économiseur par
# l'API D-Bus org.freedesktop.ScreenSaver. Sous Openbox PERSONNE ne détient ce
# nom sur le bus de session (vérifié le 2026-09-13 : ListNames ne le retourne
# pas), l'appel échoue donc SANS ERREUR VISIBLE et le compteur d'inactivité X
# continue de courir -> i3lock tombait en pleine lecture.
# Faute d'implémenter un service D-Bus complet, on réarme le compteur tant
# qu'un son sort réellement : un sink PipeWire RUNNING veut dire que des
# données audio circulent (pause -> IDLE en quelques secondes, le verrou
# reprend alors son cours normal). Couvre aussi les jeux et RetroArch.
# ⚠️ Le garde-fou `pgrep i3lock` n'est pas optionnel : xss-lock TUE le verrou
# quand l'économiseur se désactive. Sans lui, un flux audio qui continue
# derrière l'écran verrouillé (Jellyfin ne s'arrête pas tout seul) ferait
# sauter le verrou sans mot de passe.
- name: Verrou — ne pas verrouiller pendant une lecture audio
  ansible.builtin.copy:
    dest: /usr/local/bin/inhiber-verrou
    owner: root
    group: root
    mode: '0755'
    content: |
      #!/usr/bin/env bash
      # Managed by Ansible (desktop role). Lancé par l'autostart Openbox.
      set -eu
      export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
      # 60 s, très en dessous du délai de verrouillage ({{ desktop_screenlock_timeout }} s).
      while :; do
        sleep 60
        # Écran déjà verrouillé : ne rien faire, sinon xss-lock tue i3lock.
        pgrep -x i3lock >/dev/null 2>&1 && continue
        if pactl list short sinks 2>/dev/null | grep -qw RUNNING; then
          xset s reset
        fi
      done
  when: desktop_screenlock | bool

# Pegasus se CACHE pendant qu'il exécute une application externe et n'attend que
# la mort de ce processus pour revenir. Si la fenêtre de l'application disparaît
# sans que son processus meure, plus rien n'est affiché : on ne voit que le fond
# (#15151f, quasi noir) et le curseur. Constaté le 2026-09-15 avec Jellyfin Media
# Player après un déverrouillage : fenêtre démappée (Map State IsUnMapped,
# ramenée à 1x1), processus toujours vivant, Pegasus caché à l'attendre.
# La cause du démappage n'est PAS établie — ce script ne la corrige pas, il rend
# seulement la main sans SSH ni redémarrage.
# Le garde-fou i3lock est ici aussi une exigence de sécurité : sans lui, la
# commande servirait à tuer le verrou parental depuis Home Assistant.
# Usage : ssh moi@<hote> reafficher
- name: Session — sortie de secours écran noir (Pegasus caché)
  ansible.builtin.copy:
    dest: /usr/local/bin/reafficher
    owner: root
    group: root
    mode: '0755'
    content: |
      #!/usr/bin/env bash
      # Managed by Ansible (desktop role).
      set -eu
      if pgrep -x i3lock >/dev/null 2>&1; then
        echo "ecran verrouille : refus (deverrouiller d'abord)" >&2; exit 1
      fi
      P=$(pgrep -x openbox | head -1) || { echo "session graphique introuvable" >&2; exit 1; }
      while IFS= read -r -d "" v; do
        case "$v" in XDG_*|DBUS_*|DISPLAY=*|XAUTHORITY=*) export "$v";; esac
      done < "/proc/$P/environ"
      # Applications lancées par Pegasus, donc filles de pegasus-fe. Les terminer
      # débloque Pegasus, qui se réaffiche de lui-même.
      PEG=$(pgrep -f 'pegasus-fe' | head -1) || { echo "pegasus introuvable" >&2; exit 1; }
      n=0
      for enfant in $(pgrep -P "$PEG" 2>/dev/null || true); do
        cmd=$(tr '\0' ' ' < "/proc/$enfant/cmdline" 2>/dev/null || true)
        echo "fin de : $cmd"
        kill "$enfant" 2>/dev/null && n=$((n+1)) || true
      done
      [ "$n" -gt 0 ] || { echo "aucune application lancee par Pegasus" >&2; exit 1; }
      sleep 3
      echo "$n application(s) terminee(s) ; Pegasus devrait revenir"
  when: desktop_frontend == 'pegasus'

# Chien de garde de l'affichage. Pegasus se démappe pendant qu'il exécute une
# application et n'attend que la MORT du processus pour revenir : toute appli qui
# se cache en restant vivante laisse un écran mort, récupérable seulement par
# SSH. C'est arrivé deux fois avec Jellyfin Media Player (15 et 18 septembre
# 2026), qui se minimise tout seul après une lecture.
# `forceAlwaysFS` (tâche du 55_pegasus.yml) traite le cas Jellyfin ; ce chien de
# garde traite la CLASSE du problème, sans rien supposer de l'application.
# Ne se déclenche que si PLUS AUCUNE fenêtre n'est affichée : un jeu ou une
# vidéo en plein écran est une fenêtre visible, donc jamais touché.
- name: Session — chien de garde de l'écran mort
  ansible.builtin.copy:
    dest: /usr/local/bin/surveiller-ecran
    owner: root
    group: root
    mode: '0755'
    content: |
      #!/usr/bin/env bash
      # Managed by Ansible (desktop role). Lancé par l'autostart Openbox.
      set -eu
      INTERVALLE=15
      SEUIL="${1:-60}"
      vide=0
      while :; do
        sleep "$INTERVALLE"
        # Écran verrouillé : i3lock couvre tout, l'absence d'autre fenêtre est normale.
        if pgrep -x i3lock >/dev/null 2>&1; then vide=0; continue; fi
        utile=0
        for id in $(xwininfo -root -children 2>/dev/null | sed -n 's/^ *\(0x[0-9a-f]*\).*/\1/p'); do
          info=$(xwininfo -id "$id" 2>/dev/null) || continue
          case "$info" in
            *IsViewable*)
              larg=$(printf '%s' "$info" | sed -n 's/^  Width: //p')
              # Openbox garde des fenêtres techniques de 1x1 en permanence.
              if [ "${larg:-0}" -gt 100 ]; then utile=1; break; fi
              ;;
          esac
        done
        if [ "$utile" -eq 1 ]; then vide=0; continue; fi
        vide=$((vide + INTERVALLE))
        if [ "$vide" -ge "$SEUIL" ]; then
          logger -t surveiller-ecran "aucune fenetre affichee depuis ${vide}s -> reafficher"
          reafficher || true
          vide=0
        fi
      done
  when: desktop_frontend == 'pegasus'
