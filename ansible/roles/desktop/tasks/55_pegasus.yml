---
# Pegasus frontend (natif, self-contained x11-static). Shell "canapé" type Batocera.
# Lance les binaires HÔTE (Lutris/RetroArch/Brave/Jellyfin) -> PAS de Flatpak (sandbox).
# Providers Lutris + Steam = auto (import de la ludothèque). Rétro = Steam ROM Manager (suivi).

- name: Ensure unzip
  ansible.builtin.apt:
    name: unzip
    state: present
    update_cache: false

- name: Ensure Pegasus dir (unarchive exige un dest existant)
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/Applications/pegasus"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Download + extract Pegasus (self-contained)
  ansible.builtin.unarchive:
    src: "{{ desktop_pegasus_url }}"
    dest: "/home/{{ ansible_user }}/Applications/pegasus"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    creates: "/home/{{ ansible_user }}/Applications/pegasus/pegasus-fe"

- name: Ensure pegasus-fe executable
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/Applications/pegasus/pegasus-fe"
    mode: '0755'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Ensure Pegasus config + apps dirs
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - .config/pegasus-frontend
    - Games/apps

- name: Pegasus settings (providers Lutris/Steam)
  ansible.builtin.copy:
    dest: "/home/{{ ansible_user }}/.config/pegasus-frontend/settings.txt"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
    content: |
      # Managed by Ansible (desktop role).
      [general]
      fullscreen: true
      [providers]
      # Lutris + Steam auto-import (ludothèque en tuiles).

# Les dossiers de jeux vivent dans game_dirs.txt, PAS dans une section
# [game_dirs] de settings.txt : Pegasus ignore silencieusement cette section
# (constaté sur jeux -> "Pegasus Metafiles: No metadata files found", 0 jeu,
# alors que metadata.pegasus.txt était bien en place).
- name: Pegasus game dirs
  ansible.builtin.copy:
    dest: "/home/{{ ansible_user }}/.config/pegasus-frontend/game_dirs.txt"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
    content: |
      /home/{{ ansible_user }}/Games/apps
      /home/{{ ansible_user }}/retro/dreamcast
      /home/{{ ansible_user }}/retro/n64
      /home/{{ ansible_user }}/retro/gba
      /home/{{ ansible_user }}/retro/wii

# Toutes les ROMs vivent sous ~/retro/<systeme>/ : c'est le ROMDirectory d'ES-DE,
# donc un ROM posé ailleurs est invisible à son scraper. Un seul exemplaire sert
# les deux frontends.
# Collections par système : un seul fichier suffit, Pegasus liste tout seul les
# fichiers correspondant aux extensions — pas une entrée par jeu. Les titres
# affichés sont les noms de fichiers, d'où le nettoyage préalable des ROMs.
- name: Pegasus — collections par console
  ansible.builtin.copy:
    dest: "{{ item.dir }}/metadata.pegasus.txt"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
    content: |
      collection: {{ item.nom }}
      shortname: {{ item.court }}
      extensions: {{ item.ext }}
      launch: retroarch -L /home/{{ ansible_user }}/.config/retroarch/cores/{{ item.core }}_libretro.so "{file.path}"
  loop:
    - { nom: "Dreamcast", court: "dreamcast", ext: "cdi, gdi, chd", core: "flycast",
        dir: "/home/{{ ansible_user }}/retro/dreamcast" }
    - { nom: "Nintendo 64", court: "n64", ext: "z64, n64, v64", core: "mupen64plus_next",
        dir: "/home/{{ ansible_user }}/retro/n64" }
    - { nom: "Game Boy Advance", court: "gba", ext: "gba", core: "mgba",
        dir: "/home/{{ ansible_user }}/retro/gba" }
    - { nom: "Wii", court: "wii", ext: "wbfs, iso, rvz", core: "dolphin",
        dir: "/home/{{ ansible_user }}/retro/wii" }
  loop_control:
    label: "{{ item.nom }}"

- name: Apps launch scripts (Brave, Jellyfin)
  ansible.builtin.copy:
    dest: "/home/{{ ansible_user }}/Games/apps/{{ item.file }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
    content: "#!/bin/sh\nexec {{ item.cmd }} \"$@\"\n"
  loop:
    # Plein écran d'emblée : Pegasus n'a aucune prise sur le rendu des programmes
    # qu'il lance, il se contente de les exécuter. C'est donc à chaque appli de
    # démarrer en plein écran. Les jeux, ES-DE et RetroArch le font seuls ;
    # Brave et Jellyfin, non — d'où ces drapeaux.
    # jellyfin `--tv` = interface « 10 pieds », navigable à la manette/télécommande.
    - { file: "brave.sh", cmd: "brave-browser --start-fullscreen" }
    - { file: "jellyfin.sh", cmd: "jellyfinmediaplayer --tv --fullscreen" }
  loop_control:
    label: "{{ item.file }}"

- name: Pegasus "Applications" collection (Brave + Jellyfin)
  ansible.builtin.copy:
    dest: "/home/{{ ansible_user }}/Games/apps/metadata.pegasus.txt"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
    content: |
      collection: Applications
      launch: {file.path}

      game: Brave (Web)
      file: brave.sh

      game: Jellyfin
      file: jellyfin.sh
