---
# Default variables for the gaming role.

# Install the Lutris game launcher (upstream GitHub release .deb). Toggle off
# per-host if unwanted.
gaming_install_lutris: true

# Lutris version — matches a tag on https://github.com/lutris/lutris/releases
# (asset lutris_<ver>_all.deb). Renovate-trackable. No leading "v".
gaming_lutris_version: "0.5.22"

# 32-bit NVIDIA GL libs for the host's driver branch. Needed by 32-bit Wine
# installers/games (e.g. GOG InnoSetup setup.exe). DOIT correspondre à la branche
# du pilote installé, sinon apt tente de mélanger deux piles. Depuis le swap
# matériel de juillet 2026 : GTX 1050 Ti en 580 (avant : Kepler 920M en 470).
# Mettre "" pour ne rien installer.
gaming_nvidia_gl_i386_package: "libnvidia-gl-580:i386"

# OS guard.
gaming_allowed_distros: ["Ubuntu", "Linux Mint", "Bodhi"]

# Jeux natifs apt (universe). Les entrées Lutris restaurées pointent
# /usr/games/<bin> -> ces paquets DOIVENT être présents.
gaming_apt_games:
  - 0ad
  - openarena
  - supertux        # binaire /usr/games/supertux2
  - warzone2100
  - hedgewars
  - supertuxkart
  - lincity-ng
  - widelands
  - jumpnbump
  - gcompris-qt     # éducatif
  - tuxmath
  - tuxpaint
# Steam (multiverse). Game launcher.
gaming_install_steam: true

# --- RetroArch (moteur d'émulation appelé par ES-DE) ---
gaming_install_retroarch: true
# PPA libretro/stable = 1.22.2 ; noble/universe = 1.18.0. Les cores du buildbot
# n'existent qu'en "latest" -> on prend le RetroArch le plus proche d'eux.
gaming_retroarch_use_ppa: true
# Cores tirés du buildbot (aucun n'est packagé pour noble). Liste calée sur les
# ROMs réellement présentes sur gaming-pc : dreamcast 37, n64 16, gba 2.
# Nom = celui du buildbot, sans le suffixe _libretro.
gaming_retroarch_cores:
  - flycast           # Dreamcast
  - mupen64plus_next  # N64
  - mgba              # GBA
  # Wii/GameCube. Dolphin autonome ne publie plus QUE du Flatpak (vérifié
  # 2026-08-21 : artefacts Linux = .flatpak uniquement, plus d'AppImage), et
  # Flathub n'est pas configuré sur l'hôte. Le core libretro évite d'ajouter un
  # dépôt + ~1,5 Go de runtime + les droits sandbox, et réutilise le RetroArch
  # déjà intégré à ES-DE et Pegasus. À réévaluer si un jeu Wii rame.
  - dolphin           # Wii / GameCube

# --- Bluetooth stability (carte combo RTL8723BE de l'ANCIEN portable) ---
# BT firmware hangs (hci tx timeout) -> USB reset loop -> controller vanishes.
# Keep the USB BT controller from autosuspending (harmless everywhere).
gaming_btusb_disable_autosuspend: true
# Blacklist rtl8723be + btcoexist : spécifique à la carte combo WiFi/BT à antenne
# partagée du portable remplacé au swap de juillet 2026. La machine actuelle n'a
# aucune carte réseau sans fil (`lspci` : rien) — poser ce blacklist n'y
# corrigerait rien et masquerait la vraie cause d'un futur souci BT.
gaming_blacklist_rtl8723_wifi: false
