apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paseo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Paseo (https://paseo.sh) — orchestrateur d'agents de code, UI web servie par
  # le daemon sur le port 6767. Exposé en paseo.tgu.ovh derrière oauth2-proxy
  # (Middleware paseo-oauth2-forwardauth) : aucun accès sans login GitHub.
  #
  # Volumes :
  #   /home/paseo   → PVC (état daemon, config agents, credentials .claude/.codex)
  #   /data/projets → hostPath du node "pc", monté sur le MÊME chemin que sur le
  #                  host. hostPath ⇒ nodeSelector obligatoire : le répertoire
  #                  n'existe QUE sur pc (192.168.88.250), pas sur le node jeux.
  #                  /data/projets est owned 1000:1000 (moi) et le conteneur
  #                  tourne en paseo 1000:1000 → pas de chown init nécessaire.
  #
  #   /home/paseo/.claude → hostPath /home/moi/.claude (config Claude Code du
  #                  host : Paseo hérite de la session déjà authentifiée).
  #
  # L'image amont n'embarque aucun CLI d'agent : on déploie l'image fille
  # localhost:32000/paseo-agents (cf. images/paseo-agents/Dockerfile) qui ajoute
  # Claude Code.
  destination:
    namespace: paseo
    server: https://kubernetes.default.svc
  project: infra-project
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 5.1.0
    helm:
      values: |
        defaultPodOptions:
          nodeSelector:
            kubernetes.io/hostname: pc
        controllers:
          paseo:
            type: deployment
            strategy: Recreate
            containers:
              main:
                image:
                  # Image fille : Paseo 0.7.2 + Claude Code 2.1.263.
                  # Source du Dockerfile : images/paseo-agents/.
                  repository: localhost:32000/paseo-agents
                  tag: 0.7.2-cc2.1.263
                  pullPolicy: IfNotPresent
                env:
                  PASEO_WEB_UI_ENABLED: "true"
                  # Reverse-proxy : le daemon rejette les Host non déclarés.
                  PASEO_HOSTNAMES: "paseo.tgu.ovh"
                  # Auth API/WebSocket du daemon (2e barrière derrière oauth2-proxy).
                  PASEO_PASSWORD:
                    valueFrom:
                      secretKeyRef:
                        name: paseo-auth
                        key: PASEO_PASSWORD
                resources:
                  limits:   { cpu: "2", memory: 4Gi }
                  requests: { cpu: "100m", memory: 512Mi }
        service:
          app:
            controller: paseo
            ports:
              http:
                port: 6767
        ingress:
          app:
            className: public
            annotations:
              cert-manager.io/cluster-issuer: "letsencrypt-prod"
              traefik.ingress.kubernetes.io/router.middlewares: paseo-oauth2-forwardauth@kubernetescrd
            hosts:
              - host: paseo.tgu.ovh
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      identifier: app
                      port: http
            tls:
              - secretName: paseo-tls
                hosts:
                  - paseo.tgu.ovh
        persistence:
          home:
            type: persistentVolumeClaim
            accessMode: ReadWriteOnce
            size: 5Gi
            globalMounts:
              - path: /home/paseo
          projets:
            type: hostPath
            hostPath: /data/projets
            hostPathType: Directory
            globalMounts:
              # Monté sur son chemin d'origine, et PAS sur /workspace : les
              # sessions Claude Code du host sont indexées par cwd absolu
              # (~/.claude/projects/-data-projets-perso-…), donc un projet
              # enregistré sous /workspace ne correspondrait à aucune session.
              # Un seul chemin évite aussi d'enregistrer deux fois le même repo.
              - path: /data/projets
          # Config Claude Code du host, montée par-dessus le PVC : Paseo réutilise
          # la session déjà authentifiée de moi@pc (CLAUDE_CONFIG_DIR vaut déjà
          # /home/paseo/.claude dans l'image). Écriture partagée avec le host —
          # sessions, historique et credentials sont les mêmes fichiers.
          # Nom volontairement préfixé "home-" : le chart itère sur les clés de
          # persistence dans l'ordre alphabétique, et un montage imbriqué doit
          # être appliqué APRÈS son parent (/home/paseo) sous peine d'être masqué
          # par lui. home < home-claude.
          home-claude:
            type: hostPath
            hostPath: /home/moi/.claude
            hostPathType: Directory
            globalMounts:
              - path: /home/paseo/.claude
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
