apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arr-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: selfhost-project
  destination:
    server: https://kubernetes.default.svc
    namespace: selfhost
  source:
    repoURL: https://github.com/tom333/arr-stack.git
    targetRevision: v0.53.9
    path: charts/arr-stack
    helm:
      valueFiles:
        - ../../examples/values-prod.yaml
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Replace=true was added in Phase 4 for the umbrella cutover (Deployment selector
      # immutability via the app.kubernetes.io/instance label change). The cutover is done.
      # Keeping it past that makes every sync run `kubectl replace` on the 7 bjw-s/app-template
      # PVCs, and K8s rejects the replace because spec.volumeName + spec.storageClassName are
      # immutable post-bind. PR #1403's `ignoreDifferences` only affects diff computation —
      # Replace=true bypasses it on the apply side. ServerSideApply alone handles ongoing
      # reconciliation cleanly via field-level patches that respect immutability. Re-add
      # Replace=true scoped to specific resources only if a future cutover-style change
      # needs it.
    automated:
      prune: true
      selfHeal: true
  # K8s populates spec.volumeName + spec.storageClassName on PVCs after binding, then locks
  # them as immutable. Helm renders without these fields (provisioner assigns at bind time).
  # ignoreDifferences keeps these PVC fields out of the drift signal (ServerSideApply respects
  # field ownership and won't touch them anyway, but the explicit ignore prevents false drift
  # alerts in the Argo UI). resources.requests stays tracked — chart-side size changes still
  # reconcile.
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/volumeName
        - /spec/storageClassName
    # TEMPORAIRE le 2026-08-27 — À RETIRER une fois le datastore tranché.
    # arrconf, configarr et qbit-manage ont été suspendus À CHAUD (kubectl patch) après
    # avoir accumulé ~370 pods : le contrôleur de jobs, aveugle parce que les caches de
    # veille de l'apiserver étaient gelés, n'appliquait plus leurs limites pourtant
    # saines (backoffLimit 6, failedJobsHistoryLimit 2, concurrencyPolicy Forbid).
    # Cf. docs/superpowers/specs/2026-08-27-dqlite-panne-plan-de-controle.md.
    # Le chart amont (tom333/arr-stack v0.53.0) n'expose PAS de valeur `suspend`, donc
    # la suspension ne peut pas être déclarée dans les valeurs Helm : sans cet ignore,
    # selfHeal la révoquerait et l'accumulation reprendrait.
    # Pour lever : retirer ce bloc, puis `kubectl patch cronjob <nom> -n selfhost
    # -p '{"spec":{"suspend":false}}'` — ou ajouter `suspend` au chart amont, ce qui
    # rendrait ce contournement inutile.
    - group: batch
      kind: CronJob
      jsonPointers:
        - /spec/suspend
