apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arr-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: selfhost-project
  destination:
    server: https://kubernetes.default.svc
    namespace: selfhost
  source:
    repoURL: https://github.com/tom333/arr-stack.git
    # ÉPINGLÉ à v0.53.0 le 2026-08-28 après une SUPPRESSION TOTALE de la pile.
    # v0.53.9 fait passer app-template de 5.0.1 à 5.1.0, et cette version est une
    # RUPTURE pour ce chart parapluie : les 14 sous-charts ne rendent plus rien.
    # Mesuré par `helm template` sur les deux tags, dépendances construites :
    #   v0.53.0 (5.0.1) -> 59 ressources : 11 Deployment, 8 Ingress, 7 PVC, 3 CronJob
    #   v0.53.9 (5.1.0) ->  6 ressources : 4 ConfigMap, 1 Job, 1 ServiceAccount
    # Renovate a auto-mergé ce bump ; ArgoCD a synchronisé avec prune:true et a donc
    # supprimé Deployments, Ingress, CronJobs ET PVC. Les PV ont été basculés en
    # Retain à temps (données intactes sur disque), mais rien ne garantissait ce
    # délai — c'est le motif `prune:true` + auto-merge qui est en cause.
    # NE PAS remonter sans avoir vérifié le rendu :
    #   helm dependency build && helm template . -f ../../examples/values-prod.yaml \
    #     | grep -c '^kind:'
    targetRevision: v0.53.10
    path: charts/arr-stack
    helm:
      valueFiles:
        - ../../examples/values-prod.yaml
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Replace=true was added in Phase 4 for the umbrella cutover (Deployment selector
      # immutability via the app.kubernetes.io/instance label change). The cutover is done.
      # Keeping it past that makes every sync run `kubectl replace` on the 7 bjw-s/app-template
      # PVCs, and K8s rejects the replace because spec.volumeName + spec.storageClassName are
      # immutable post-bind. PR #1403's `ignoreDifferences` only affects diff computation —
      # Replace=true bypasses it on the apply side. ServerSideApply alone handles ongoing
      # reconciliation cleanly via field-level patches that respect immutability. Re-add
      # Replace=true scoped to specific resources only if a future cutover-style change
      # needs it.
    automated:
      prune: true
      selfHeal: true
  # K8s populates spec.volumeName + spec.storageClassName on PVCs after binding, then locks
  # them as immutable. Helm renders without these fields (provisioner assigns at bind time).
  # ignoreDifferences keeps these PVC fields out of the drift signal (ServerSideApply respects
  # field ownership and won't touch them anyway, but the explicit ignore prevents false drift
  # alerts in the Argo UI). resources.requests stays tracked — chart-side size changes still
  # reconcile.
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/volumeName
        - /spec/storageClassName
