apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Hindsight (vectorize-io) — mémoire d'agent auto-hébergée, licence MIT.
  #
  # POURQUOI. Les deux mémoires du parc sont disjointes et l'une est vide :
  #   - Claude Code : 36 fichiers curés à la main, 196 Ko, index de 32 entrées ;
  #   - Hermes : `hermes memory status` dit « enabled ✓ » mais MEMORY.md et USER.md
  #     N'EXISTENT PAS sur le PVC. Il n'a donc pas de mémoire, il a un historique —
  #     330 sessions, 15 998 messages, 502 Mo de state.db — qu'il ne sait que
  #     grepper (FTS5 + trigram, mot-clé uniquement).
  # Ce que Hindsight apporte et que personne ne fait ici : récupération par graphe
  # et temporelle (TEMPR), et surtout la CONSOLIDATION (dédoublonnage, traçabilité
  # des sources). Exposé en MCP, il peut servir Hermes ET Claude Code — donc le
  # substrat partagé qui manque, au lieu d'une quatrième mémoire disjointe.
  #
  # ⚠️ Le pari n'est pas gagné d'avance : le problème de Hermes n'est pas
  # l'algorithme de récupération, c'est que rien n'écrit. Brancher de la machinerie
  # sophistiquée sur une mémoire vide donne une mémoire vide bien indexée. À
  # évaluer sur pièce, pas à adopter d'office.
  #
  # PLACEMENT. Sur `pc` faute de mieux : le nœud `jeux`, qui avait 8 Gi de marge,
  # est injoignable depuis le 2026-08-09 01:57Z. À reconsidérer à son retour.
  name: hindsight
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: hindsight
    server: https://kubernetes.default.svc
  project: infra-project
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 5.0.1
    helm:
      values: |
        controllers:
          hindsight:
            type: deployment
            strategy: Recreate          # PostgreSQL embarqué sur PVC RWO : un seul writer
            pod:
              # `jeux` est mort ; et même à son retour ce pod n'a rien à y faire
              # tant qu'on n'a pas mesuré son empreinte réelle.
              nodeSelector:
                kubernetes.io/hostname: pc
            initContainers:
              # microk8s-hostpath IGNORE fsGroup (quirk connu, déjà contourné pour
              # hermes). L'image tourne sous l'utilisateur `hindsight` — un NOM, pas
              # un uid numérique, donc impossible à deviner depuis le manifeste.
              # D'où cet initContainer bâti sur LA MÊME IMAGE, lancé en root : il
              # résout le nom via son propre /etc/passwd. Aucun uid codé en dur.
              fix-ownership:
                image:
                  repository: ghcr.io/vectorize-io/hindsight
                  tag: "0.9.0"
                command: ["sh", "-c"]
                args:
                  - |
                    set -e
                    mkdir -p /home/hindsight/.pg0
                    chown -R hindsight:hindsight /home/hindsight/.pg0
                    ls -ldn /home/hindsight/.pg0
                securityContext:
                  runAsUser: 0
            containers:
              main:
                image:
                  repository: ghcr.io/vectorize-io/hindsight
                  # Les tags ghcr perdent le "v" initial : release v0.9.0 -> image
                  # 0.9.0. Même convention que crw. `latest` volontairement écarté.
                  tag: "0.9.0"
                  pullPolicy: IfNotPresent
                env:
                  # OBLIGATOIRE ici, et le logiciel le dit lui-même au démarrage :
                  #   « The worker id is defaulting to the container hostname, which
                  #     CHANGES every time the container is recreated. When that
                  #     happens, tasks left in 'processing' under the old hostname are
                  #     never recovered — consolidation and other async operations can
                  #     get stuck indefinitely. »
                  # Sur un Deployment le nom du pod porte un suffixe aléatoire, donc
                  # chaque redémarrage orphelinerait les tâches en cours — et la
                  # consolidation est précisément ce pourquoi ce service existe. Une
                  # valeur stable, indépendante du nom du pod.
                  HINDSIGHT_API_WORKER_ID: hindsight
                  # ── LLM : le modèle DÉJÀ courant, et c'est délibéré ────────────
                  # LOCALAI_SINGLE_ACTIVE_BACKEND=true n'évince que si on demande un
                  # modèle DIFFÉRENT. Hermes utilise déjà gemma-4-12b-it-qat : viser
                  # le même évite toute éviction en régime normal. Le conflit ne
                  # surgira que pendant une campagne de banc sur un autre modèle.
                  # `lmstudio` = simple façade OpenAI-compatible ; c'est BASE_URL qui
                  # décide réellement de la destination.
                  HINDSIGHT_API_LLM_PROVIDER: lmstudio
                  HINDSIGHT_API_LLM_BASE_URL: http://localai.localai.svc.cluster.local:8080/v1
                  HINDSIGHT_API_LLM_MODEL: gemma-4-12b-it-qat
                  HINDSIGHT_API_LLM_API_KEY:
                    valueFrom:
                      secretKeyRef: { name: hindsight-llm-key, key: api-key }
                  # La doc exige 65 000 tokens de SORTIE par défaut ; elle documente
                  # aussi ce garde-fou pour les modèles plus modestes. Doit rester
                  # supérieur à RETAIN_CHUNK_SIZE (défaut 3000), validé au démarrage.
                  # 16000 -> 8000 le 2026-08-10 : une extraction réelle mesurée sur ce
                  # cluster a consommé 3 967 tokens de sortie, donc 8000 laisse le
                  # double de marge tout en divisant par deux le pire cas.
                  HINDSIGHT_API_RETAIN_MAX_COMPLETION_TOKENS: "8000"
                  # Le défaut de 120 s est dimensionné pour une API distante rapide.
                  # Ici gemma tourne en local sur une RTX 3060 : une extraction
                  # mesurée a pris 57 s pour un texte de trois phrases, et le premier
                  # `retain` réel a échoué sur
                  #   « APIConnectionError (HTTP None), attempt 1: Request timed out »
                  # C'est le client de Hindsight qui abandonnait, pas gemma qui
                  # refusait. 900 s couvre largement le pire cas à 8000 tokens de
                  # sortie et ~40-60 tok/s, chargement du modèle compris (68 s
                  # mesurés à froid).
                  HINDSIGHT_API_LLM_TIMEOUT: "900"
                  # ── Embeddings : multilingue, mais LÉGER ───────────────────────
                  # bge-m3 est le meilleur multilingue mais pèse ~2,2 Go de RAM.
                  # paraphrase-multilingual-MiniLM (50+ langues) est annoncé
                  # « Lighter weight » (~0,5 Go) — le bon compromis ici, où tout le
                  # contenu est en français et où le nœud est le seul disponible.
                  HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
                  # ── Reranker : AUCUN, et c'est un choix ────────────────────────
                  # Le défaut `cross-encoder/ms-marco-MiniLM-L-6-v2` est ANGLAIS
                  # UNIQUEMENT (dit par la doc) ; sur du contenu français il
                  # classerait moins bien que pas de reranker du tout. L'alternative
                  # multilingue bge-reranker-v2-m3 coûte encore ~2,2 Go.
                  # `rrf` = fusion de rangs pure : « results come back in the order
                  # the retrieval stages produced, exactly as if no reranker were
                  # configured ». Zéro mémoire, zéro faux classement.
                  HINDSIGHT_API_RERANKER_PROVIDER: rrf
                  # BM25 côté PostgreSQL : le backend `native` gère le français sans
                  # extension supplémentaire.
                  HINDSIGHT_API_TEXT_SEARCH_EXTENSION_NATIVE_LANGUAGE: french
                  # Consolidation et entretien du graphe EN SÉRIE plutôt qu'en
                  # éventail sur les cœurs — le nœud porte aussi LocalAI, Whisper et
                  # une session de bureau.
                  HINDSIGHT_API_DB_MAX_PARALLEL_WORKERS_PER_GATHER: "0"
                resources:
                  # Doc : 1,5-2 Go pour l'image complète, +~0,5 Go pour l'embedder
                  # multilingue. La request reste basse : c'est elle qui gouverne
                  # l'ordonnancement, et le nœud vient tout juste de repasser de 80 %
                  # à 34 % de réservation.
                  requests: { cpu: "100m", memory: 1Gi }
                  limits:   { cpu: "2",    memory: 4Gi }
                probes:
                  # Premier démarrage : téléchargement du modèle d'embeddings +
                  # initialisation du PostgreSQL embarqué. 10s x 90 = 15 min.
                  startup:   { enabled: true, custom: true, spec: { tcpSocket: { port: 8888 }, periodSeconds: 10, failureThreshold: 90 } }
                  liveness:  { enabled: true, custom: true, spec: { tcpSocket: { port: 8888 }, periodSeconds: 30, timeoutSeconds: 5, failureThreshold: 3 } }
                  readiness: { enabled: true, custom: true, spec: { tcpSocket: { port: 8888 }, periodSeconds: 15, timeoutSeconds: 5, failureThreshold: 3 } }
        service:
          main:
            controller: hindsight
            ports:
              api:
                port: 8888
              ui:
                port: 9999
        # DEUX hôtes plutôt qu'un seul avec des chemins : l'UI (9999) et l'API
        # (8888) sont deux serveurs distincts, et l'UI appelle l'API depuis le
        # navigateur — router `/mcp` d'un côté et `/` de l'autre casserait ses
        # requêtes. Le MCP se trouve sous /mcp/{banque}/ de l'API.
        #
        # ⚠️ AUCUNE authentification native n'est active (l'extension tenant est
        # optionnelle et non configurée). L'ipAllowList EST donc la seule porte —
        # d'où LAN uniquement, jamais de WAN sans une auth devant. Même posture que
        # searxng et beszel ; à l'opposé de `shell` qui exige oauth2-proxy.
        ingress:
          ui:
            enabled: true
            className: traefik
            annotations:
              cert-manager.io/cluster-issuer: "letsencrypt-prod"
              traefik.ingress.kubernetes.io/router.middlewares: hindsight-lan-only@kubernetescrd
            hosts:
              - host: hindsight.tgu.ovh
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      identifier: main
                      port: ui
            tls:
              - hosts: [hindsight.tgu.ovh]
                secretName: hindsight-tls
          api:
            enabled: true
            className: traefik
            annotations:
              cert-manager.io/cluster-issuer: "letsencrypt-prod"
              traefik.ingress.kubernetes.io/router.middlewares: hindsight-lan-only@kubernetescrd
            hosts:
              - host: hindsight-api.tgu.ovh
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      identifier: main
                      port: api
            tls:
              - hosts: [hindsight-api.tgu.ovh]
                secretName: hindsight-api-tls
        persistence:
          data:
            enabled: true
            type: persistentVolumeClaim
            storageClass: microk8s-hostpath
            accessMode: ReadWriteOnce
            size: 10Gi
            globalMounts:
              - path: /home/hindsight/.pg0
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
