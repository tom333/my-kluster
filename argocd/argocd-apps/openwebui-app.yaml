apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openwebui
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: openwebui
    server: https://kubernetes.default.svc
  project: datalab-project
  source:
    repoURL: https://helm.openwebui.com/
    targetRevision: 15.2.0
    chart: open-webui
    helm:
      values: |
        # Local LLM is served by LocalAI in the localai namespace, not Ollama.
        ollama:
          enabled: false

        # Disable Tika & Redis: single-replica, no document RAG yet.
        tika:
          enabled: false
        websocket:
          enabled: false

        # Pipelines = service Python séparé (:9099) pour du middleware LLM lourd.
        # Inutile ici : la doc upstream recommande les Functions natives pour les
        # filtres/providers (rate-limit, RAG, tracking) ; Pipelines ne se justifie
        # que pour des dépendances lourdes ou du calcul à déporter. Le pod bouclait
        # (52 restarts) et ajoutait une connexion morte dans OPENAI_API_BASE_URLS.
        pipelines:
          enabled: false

        persistence:
          enabled: true
          provider: local
          storageClass: microk8s-hostpath
          size: 10Gi
          accessModes:
            - ReadWriteOnce

        replicaCount: 1

        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 200m
            memory: 512Mi

        # Public ingress with oauth2-proxy (GitHub auth tom333/tguyader).
        # A second LAN-only ingress lives in config/openwebui-lan-ingress.yaml
        # to keep its lifecycle independent of this Helm release.
        ingress:
          enabled: true
          class: nginx
          host: chat.tgu.ovh
          tls: true
          existingSecret: chat-tls
          annotations:
            cert-manager.io/cluster-issuer: "letsencrypt-prod"
            # Sablier (scale-to-zero) RETIRÉ le 2026-07-26 : il servait sa page
            # d'attente `<meta refresh=5>` en boucle alors que le StatefulSet était
            # prêt (1/1) → login impossible (la page se rechargeait toutes les 5s).
            # Service destiné à toute la maison → doit répondre immédiatement.
            traefik.ingress.kubernetes.io/router.middlewares: openwebui-oauth2-forwardauth@kubernetescrd

        extraEnvVars:
          # ── Config déclarative ────────────────────────────────────────────
          # Par défaut Open WebUI lit les variables UNE FOIS au premier boot puis
          # la base SQLite fait foi (les changements d'env sont ignorés ensuite).
          # false => l'env redevient la source de vérité à CHAQUE démarrage = GitOps.
          # ⚠️ Contrepartie : les réglages faits dans l'UI admin ne survivent plus
          # au redémarrage (même modèle mental que le config.yaml d'Hermes,
          # re-seedé depuis son ConfigMap). Ce qui n'a pas d'équivalent en env
          # (presets "Models" + leur system prompt, Functions) se versionne via
          # GET/POST /api/v1/configs/export|import.
          - name: ENABLE_PERSISTENT_CONFIG
            value: "false"

          - name: OPENAI_API_BASE_URLS
            value: "http://localai.localai.svc.cluster.local:8080/v1"
          - name: OPENAI_API_KEYS
            valueFrom:
              secretKeyRef:
                name: localai-api-key
                key: api-key
          - name: ENABLE_OLLAMA_API
            value: "false"
          # Open WebUI bootstrap: the first user to sign up automatically
          # becomes admin. Subsequent signups land in "pending" and need
          # explicit approval from the admin UI. Tighten ENABLE_SIGNUP to
          # "false" later if you want a fully closed instance.
          - name: ENABLE_SIGNUP
            value: "false"
          - name: DEFAULT_USER_ROLE
            value: "pending"
          - name: WEBUI_AUTH
            value: "true"

          # ── Modèles ───────────────────────────────────────────────────────
          # `current` = alias LocalAI qui suit le gagnant du pipeline d'éval
          # (charts/localai/values.yaml) → rien à changer ici lors d'un swap.
          - name: DEFAULT_MODELS
            value: "current"
          - name: MODEL_ORDER_LIST
            value: "current,qwen2.5-7b-instruct,gemma-4-12b-it-qat,qwen2.5-1.5b-instruct"
          # Titres/tags de conversation : forcer un PETIT modèle, sinon Open WebUI
          # utilise le modèle courant (le 30B) juste pour titrer un chat → swap
          # VRAM inutile et lent (SINGLE_ACTIVE_BACKEND = 1 modèle à la fois).
          - name: TASK_MODEL
            value: "qwen2.5-1.5b-instruct"
          - name: TASK_MODEL_EXTERNAL
            value: "qwen2.5-1.5b-instruct"

          # ── STT (transcription vocale) ────────────────────────────────────
          # Servi par localai-jeux (whisper-large-v3-turbo sur le GPU du nœud
          # `jeux`) → ne dispute pas le GPU du nœud `pc` (LLM + images).
          - name: AUDIO_STT_ENGINE
            value: "openai"
          - name: AUDIO_STT_OPENAI_API_BASE_URL
            value: "http://localai-jeux.localai.svc.cluster.local:8080/v1"
          - name: AUDIO_STT_OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: localai-api-key
                key: api-key
          - name: AUDIO_STT_MODEL
            value: "whisper-large-v3-turbo"

          # ── TTS ───────────────────────────────────────────────────────────
          # PAS ENCORE CÂBLÉ : piper n'existe que derrière le protocole Wyoming
          # (voice/wyoming-piper:10200), il n'expose pas /v1/audio/speech.
          # À faire : backend TTS dans LocalAI, ou pont Wyoming→OpenAI.
          # - name: AUDIO_TTS_ENGINE
          #   value: "openai"
          # - name: AUDIO_TTS_OPENAI_API_BASE_URL
          #   value: "http://localai.localai.svc.cluster.local:8080/v1"

          # ── Génération d'images ───────────────────────────────────────────
          - name: ENABLE_IMAGE_GENERATION
            value: "true"
          - name: IMAGE_GENERATION_ENGINE
            value: "openai"
          - name: IMAGES_OPENAI_API_BASE_URL
            value: "http://localai.localai.svc.cluster.local:8080/v1"
          - name: IMAGES_OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: localai-api-key
                key: api-key
          - name: IMAGE_GENERATION_MODEL
            value: "flux.2-klein"

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
