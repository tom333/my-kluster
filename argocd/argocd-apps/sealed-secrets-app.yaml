apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  project: infra-project
  source:
    path: ""
    # 2026-06-15 : le projet a migré de l'organisation `bitnami-labs` vers
    # `bitnami`. GitHub Pages NE REDIRIGE PAS : l'ancienne URL renvoie un 404 sec
    # et ArgoCD ne pouvait plus générer les manifestes (« Failed to load target
    # state »). Le contrôleur déployé continuait de tourner, donc rien ne
    # cassait visiblement — mais plus aucune mise à jour n'était possible, et une
    # resynchronisation complète aurait échoué. Version inchangée : la 2.18.6 est
    # présente au nouvel emplacement.
    repoURL: https://bitnami.github.io/sealed-secrets
    targetRevision: 2.18.6
    chart: sealed-secrets
    helm:
      values: |
        fullnameOverride: sealed-secrets-controller
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        metrics:
          serviceMonitor:
            enabled: false
        keyrenewperiod: "720h"
        rbac:
          create: true
          pspEnabled: false
        networkPolicy:
          enabled: false
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: sealed-secrets-controller
      namespace: kube-system
      jqPathExpressions:
        - '.spec.template.spec.containers[].env[]?.valueFrom?.resourceFieldRef?.divisor'
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      selfHeal: true
      prune: true
