apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: veille
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: veille
    server: https://kubernetes.default.svc
  project: datalab-project
  source:
    path: apps/veille
    repoURL: https://github.com/tom333/my-kluster.git
    targetRevision: HEAD
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
